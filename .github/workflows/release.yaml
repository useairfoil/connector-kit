name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # Keep the environment and workflow filename for npm trusted publishing.
    environment: release

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release plan
        run: |
          pnpm changeset status --output "$RUNNER_TEMP/changeset-status.json"
          jq -e 'all(.releases[]; .type != "major")' "$RUNNER_TEMP/changeset-status.json"
      - name: Version or publish packages
        uses: changesets/action@v2.1.2
        with:
          # A PAT lets the release PR trigger the normal CI checks.
          github-token: ${{ secrets.GIT_TOKEN }}
          version-script: pnpm run version-packages
          publish-script: pnpm run release
