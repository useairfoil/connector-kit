name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    # Keep the environment and workflow filename for npm trusted publishing.
    environment: release

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release plan
        run: |
          pnpm changeset status --output "$RUNNER_TEMP/changeset-status.json"
          jq -e 'all(.releases[]; .type != "major")' "$RUNNER_TEMP/changeset-status.json"
      - name: Version or publish packages
        uses: changesets/action@v2.1.2
        env:
          GIT_COMMIT: ${{ github.sha }}
        with:
          # A PAT lets the release PR trigger the normal CI checks.
          github-token: ${{ secrets.GIT_TOKEN }}
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "release: bump versions"
          pr-title: release packages

  publish-images:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        connector:
          - producer-facebook-ads
          - producer-github
          - producer-google-analytics
          - producer-hubspot
          - producer-incident-io
          - producer-linear
          - producer-polar
          - producer-salesforce
          - producer-shopify
          - producer-stripe
          - producer-zendesk

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: connectors/${{ matrix.connector }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.connector }}:${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.connector }}
          cache-to: type=gha,mode=max,scope=${{ matrix.connector }}
