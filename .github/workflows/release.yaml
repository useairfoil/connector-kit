name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    # Keep the environment and workflow filename for npm trusted publishing.
    environment: release

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release plan
        run: |
          pnpm changeset status --output "$RUNNER_TEMP/changeset-status.json"
          jq -e 'all(.releases[]; .type != "major")' "$RUNNER_TEMP/changeset-status.json"
      - name: Version or publish packages
        uses: changesets/action@v2.1.2
        env:
          GIT_COMMIT: ${{ github.sha }}
        with:
          # A PAT lets the release PR trigger the normal CI checks.
          github-token: ${{ secrets.GIT_TOKEN }}
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "release: bump versions"
          pr-title: release packages

  build-images:
    runs-on: ${{ matrix.platform.runner }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        connector:
          - producer-facebook-ads
          - producer-github
          - producer-google-analytics
          - producer-hubspot
          - producer-incident-io
          - producer-linear
          - producer-polar
          - producer-salesforce
          - producer-shopify
          - producer-stripe
          - producer-zendesk
        platform:
          - name: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - name: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: connectors/${{ matrix.connector }}/Dockerfile
          platforms: ${{ matrix.platform.name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.connector }},push-by-digest=true,name-canonical=true,push=true
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.connector }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.connector }}-${{ matrix.platform.arch }}
      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          mkdir -p "/tmp/digests/${{ matrix.connector }}"
          touch "/tmp/digests/${{ matrix.connector }}/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.connector }}-${{ matrix.platform.arch }}
          path: /tmp/digests
          if-no-files-found: error
          retention-days: 1

  publish-images:
    needs: build-images
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifests
        run: |
          set -euo pipefail
          for dir in /tmp/digests/*/; do
            connector="$(basename "$dir")"
            image="ghcr.io/${{ github.repository_owner }}/${connector}"
            digests=()
            for f in "$dir"*; do
              digests+=("${image}@sha256:$(basename "$f")")
            done
            if [ "${#digests[@]}" -ne 2 ]; then
              echo "Expected 2 digests for ${connector}, got ${#digests[@]}" >&2
              exit 1
            fi
            docker buildx imagetools create -t "${image}:${{ github.sha }}" "${digests[@]}"
            docker buildx imagetools inspect "${image}:${{ github.sha }}"
          done
