name: Build & Test

on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: pnpm install
      - name: Show nx projects
        run: pnpm dlx nx show projects
      - name: Run lint
        run: pnpm run lint
      - name: Run format
        run: pnpm run format
      - name: Run build
        run: pnpm run build
      - name: Run typecheck
        run: pnpm run typecheck
      - name: Run test
        run: pnpm run test:ci
      - name: Check changes
        if: github.head_ref != 'changeset-release/main'
        run: |
          pnpm changeset status --output "$RUNNER_TEMP/changeset-status.json"
          jq -e 'all(.releases[]; .type != "major")' "$RUNNER_TEMP/changeset-status.json"
      - name: Require a changeset for package changes
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since "${{ github.event.pull_request.base.sha }}"
