services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    entrypoint: weed
    command: ["mini", "-s3", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: devaccesskey
      AWS_SECRET_ACCESS_KEY: devsecretkey
      S3_BUCKET: default-bucket
      S3_TABLE_BUCKET: default-catalog
    ports:
      - "8333:8333"
      - "8181:8181"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8333"]
      interval: 2s
      timeout: 3s
      retries: 15

  engine:
    image: docker.useairfoil.com/airfoil/storage-engine:0.2.0-alpha.6
    command:
      - dev
      - --server.address=0.0.0.0:7777
    container_name: engine-dev
    environment:
      - RUST_LOG=info
      - SE_S3_BUCKET=default-bucket
      - SE_S3_ENDPOINT=http://seaweedfs:8333
      - OTEL_SDK_DISABLED=true
      - AWS_ACCESS_KEY_ID=devaccesskey
      - AWS_SECRET_ACCESS_KEY=devsecretkey
      - AWS_REGION=us-east-1
      - AWS_ALLOW_HTTP=true
    ports:
      - "7777:7777"
    depends_on:
      seaweedfs:
        condition: service_healthy

volumes:
  seaweedfs-data:
